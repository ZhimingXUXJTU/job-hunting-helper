# ============================================================
# 评分规则（全部规则只有这一份文件）
# run_workflow.py 与 prompts/02-evaluate-jd.md 都以这里为准。
# 修改后立即生效，无需重启任何东西。
# ============================================================

# ---------- 红线：一条命中即淘汰，技能再匹配也不抵消 ----------
redlines:
  # 用工形式
  employment_type_blocked: [外包, 派遣, 劳务外包, 驻场]
  # 目标城市（JD 的城市不在列表内即淘汰；列表为空表示不限制）
  cities_allowed: []
  # JD 文本命中即淘汰的关键词
  keyword_blocked: [培训费, 押金, 缴费上岗]
  # 注意：薪资不在红线里（2026-11 调整）。低于底线只减分，不淘汰，见 salary_notes。

# ---------- 薪资：只影响评分，不作一票否决 ----------
salary_notes:
  basis: total_package        # 按综合年包（月薪 × 薪数）判断，不按单月比较
  missing: manual_review      # JD 没写薪资不猜，标人工复核
  # 可选：按城市填月薪参考线（只加减分），留空则只按 facts.yml 的底线/期望比较
  # reference_lines: [{city: 上海, floor_k: 25}]

# ---------- 七维评分：每维 0-100，加权汇总成总分 ----------
dimensions:
  skill_evidence:            # 技能证据：JD 硬性要求与「实操过」技能的交集
    weight: 30
  responsibility:            # 职责：JD 职责与履历职责的层级是否匹配
    weight: 15
  direction:                 # 方向：业务领域/技术方向与目标方向的契合度
    weight: 15
  salary:                    # 薪资：相对底线与期望的位置（按综合年包口径）
    weight: 15
  commute:                   # 通勤：城市与通勤成本
    weight: 5
  company_risk:              # 公司风险：经营/舆情/规模信号（无负面=高分）
    weight: 10
  freshness:                 # 岗位新鲜度：发布时间距今越近分越高
    weight: 10

# ---------- 阈值：总分落到哪一档，就执行哪一档的动作 ----------
thresholds:
  advance: 80        # >= 80 重点推进：定制材料 + 尽快投递
  review: 65         # >= 65 人工复核：人再看一眼再决定
  # 其余：观察（记录不投入）或放弃（明确不匹配）

# JD 里薪资/城市/发布时间缺失时，相关维度记 0 分并标 manual_review，
# 总分旁边会写明「数据不全，仅供粗筛」，不替人猜。
